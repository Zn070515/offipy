site_name: offipy
site_description: Live Microsoft Office automation via COM (session-based) + HTML-first slide pipeline
repo_url: https://github.com/Zn070515/offipy
docs_dir: docs

exclude_docs: |
  # 内部开发文档不进 git 追踪，也排除出站点构建
  development/
  development-history/
  superpowers/

nav:
  - 首页: index.md
  - 快速上手: usage.md
  - API 参考:
      - 总览: api/index.md
      - Excel: api/excel.md
      - Word: api/word.md
      - PowerPoint: api/ppt.md
  - 异常契约: exceptions.md
  - 协议: protocol.md
  - 兼容矩阵: compatibility.md
  - 弃用政策: deprecation.md
  - 性能基准: benchmarks.md
  - PPTX 质量审计: audit.md
  - 基线回归: audit-baseline.md
  - English:
      - Home: index.en.md
      - Quick Start: usage.en.md
      - API Reference:
          - Overview: api/index.en.md
          - Excel: api/excel.en.md
          - Word: api/word.en.md
          - PowerPoint: api/ppt.en.md
      - Exception Contract: exceptions.en.md
      - Protocol: protocol.en.md
      - Compatibility: compatibility.en.md
      - Deprecation Policy: deprecation.en.md
      - Benchmarks: benchmarks.en.md
      - PPTX Quality Audit: audit.en.md
      - Baseline Regression: audit-baseline.en.md

theme:
  name: material
  language: zh
  features:
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables

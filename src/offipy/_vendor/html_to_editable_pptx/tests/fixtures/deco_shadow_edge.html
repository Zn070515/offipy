<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  .slide { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #ffffff; }
  /* 贴底卡片 + 向下阴影：box-shadow 捕获框超出视口 1080 */
  .card { position: absolute; left: 100px; top: 1000px; width: 400px; height: 80px;
          background: #fff; box-shadow: 0 60px 40px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<section class="slide">
  <div class="card"></div>
</section>
</body>
</html>

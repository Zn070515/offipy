<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  .slide { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #ffffff; }
  /* div.drawio 是 deck 注入占位：显式定高（主题 CSS 提供），无背景无边框 */
  .drawio { position: absolute; left: 200px; top: 240px; width: 900px; height: 500px; }
  h1 { position: absolute; top: 120px; left: 200px; font-size: 48px; font-family: Arial, sans-serif; }
</style>
</head>
<body>
<section class="slide">
  <h1>架构图</h1>
  <div class="drawio" data-drawio="arch.drawio"></div>
</section>
</body>
</html>

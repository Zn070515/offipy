<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 单页 split-2col deck：复刻 layouts.py 修复后的 CSS。整页唯一 slide 的
     naturalDisplay 即 flex，measure 激活时不会把 display 覆盖成 block，
     忠实复现真实 split-2col 使用场景（deck 全是 split-2col 页）。 */
  * { margin: 0; box-sizing: border-box; }
  .slide { width: 1920px; height: 1080px; position: relative; overflow: hidden;
           background: #ffffff; }
  .split-2col { display: flex; gap: 80px; align-items: flex-start; }
  .split-2col > .cols { display: contents; }
  .split-2col .col { flex: 1; align-self: stretch; background: #f5f7fa;
                     border-radius: 16px; padding: 40px; box-sizing: border-box; }
  .split-2col .col-title { font-size: 40px; font-weight: 700; }
  .split-2col .col p { font-size: 28px; line-height: 1.7; color: #222; }
  .split-2col .kicker { font-size: 28px; color: #666; margin-bottom: 16px; }
  .split-2col h1 { font-size: 64px; color: #111; margin-bottom: 24px; }
</style>
</head>
<body>
<section class="slide split-2col" data-pptx-slide data-layout="split-2col">
  <p class="kicker">AGENDA_KICKER</p>
  <h1>QUARTERLY_TITLE</h1>
  <div class="cols">
    <div class="col">
      <h2 class="col-title">左栏标题</h2>
      <p>LEFT_COL_BODY</p>
    </div>
    <div class="col">
      <h2 class="col-title">右栏标题</h2>
      <p>RIGHT_COL_BODY</p>
    </div>
  </div>
</section>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  .slide { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #ffffff; }
  .grad { position: absolute; left: 100px; top: 100px; width: 400px; height: 200px;
          background: linear-gradient(135deg, #667eea, #764ba2); }
  .shadowed { position: absolute; left: 100px; top: 400px; width: 300px; height: 150px;
              background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
</style>
</head>
<body>
<section class="slide">
  <div class="grad"></div>
  <div class="shadowed"></div>
</section>
</body>
</html>

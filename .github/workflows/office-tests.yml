# 自托管 Office 真机测试（reusable，P0-5/P0-6）：CI 与 release 共享同一 runner 配置，
# 防两条 workflow 各自维护导致漂移。
#
# 两种来源：
#   - install_from_wheel: false（CI push/PR）→ uv sync 源码模式跑真机测试
#   - install_from_wheel: true（release）→ 下载 dist artifact，装最终 wheel 到干净
#     venv 再跑——真机门禁验证的是「要发布的包」，而非工作区源码。
#
# 前置（见 docs/release.md）：
#   - 自托管 runner labels: [self-hosted, windows, office]
#   - 仓库需配置 required status check（release 的 office-real 默认必经）

name: Office tests (reusable)

on:
  workflow_call:
    inputs:
      # 装 wheel 跑（release）还是 uv sync 源码跑（CI）
      install_from_wheel:
        type: boolean
        required: false
        default: false
      # install_from_wheel 时下载的 dist artifact 名
      dist_artifact:
        type: string
        required: false
        default: ""
      # 测试标记子集（默认真机 COM + deck_render）
      test_marker:
        type: string
        required: false
        default: "com or deck_render"

jobs:
  office-tests:
    runs-on: [self-hosted, windows, office]
    # #106 的超时设在这里（本 workflow 内部 job）：调用方 ci.yml/release.yml 的
    # office-real 是 uses: 可复用 job，GitHub 不允许在其上写 timeout-minutes。
    timeout-minutes: 30
    # 自托管 runner 直连 github.com 主站被墙（api.github.com 能通、主站超时），
    # git fetch / setup-uv 下载 / uv sync 全部经本机 VPN 本地代理 127.0.0.1:12334。
    # 代理地址是这台 runner 宿主机 VPN 的端口，换 VPN/端口时需同步。
    # 小写 key（GitHub 对 env key 大小写不敏感，大小写变体共存会导致 schema 失败）。
    env:
      http_proxy: http://127.0.0.1:12334
      https_proxy: http://127.0.0.1:12334
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0；≥7.1.4 修复自托管 Windows runner 的 Node libuv 崩溃（UV_HANDLE_CLOSING，src\win\async.c）
        with:
          enable-cache: false

      # 自托管 runner 服务非管理员账户，actions/setup-python 查/清注册表被拒
      # （SecurityException），故不装系统 Python——uv 按 .python-version(3.12)
      # 自管/自装解释器，绕开注册表权限。

      - name: Download dist artifact
        if: inputs.install_from_wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.dist_artifact }}
          path: dist

      # 装 wheel 用 bash。P0-2：`"dist"/*.whl"[office,deck,mcp]"` 会把 extras 拼进
      # glob pattern 变字面量（`*.whl[office,...]` 匹配不到文件），须先单独展开 wheel
      # 到变量、`test -f` + 单 wheel 断言，再拼 extras（PowerShell 不展开原生通配符）。
      - name: Install final wheel into clean venv
        if: inputs.install_from_wheel
        shell: bash
        run: |
          uv venv .venv-wheel
          if [ -f ".venv-wheel/Scripts/python.exe" ]; then
            _py=".venv-wheel/Scripts/python.exe"
          else
            _py=".venv-wheel/bin/python"
          fi
          wheel="$("$_py" -c 'import glob; w=glob.glob("dist/offipy-*.whl"); assert len(w)==1, w; print(w[0])')"
          test -f "$wheel"
          uv pip install --python .venv-wheel "${wheel}[office,deck,mcp,feedback]" pytest

      - name: Sync dependencies (source mode)
        if: ${{ !inputs.install_from_wheel }}
        run: uv sync --extra dev

      - name: Install Playwright browser (deck 管线 DOM 测量)
        shell: bash
        run: |
          if [ "${{ inputs.install_from_wheel }}" = "true" ]; then
            .venv-wheel/Scripts/python.exe -m playwright install chromium
          else
            uv run playwright install chromium
          fi

      # pywin32 类型库缓存自愈（#107 真机踩坑）：%TEMP%\gen_py 损坏（Office 升级 /
      # 生成中断 / pywin32 重装常见）会让 EnsureDispatch 报
      # "module ... has no attribute 'CLSIDToClassMap'"，Word 等 op 全挂。
      # 用与后续测试相同的解释器清空缓存，下次启动自动重建类型库。
      # 与 COM 测试用同一解释器，避免 bash $TEMP 与 Windows Python 临时目录映射错位。
      - name: Clear pywin32 gen_py cache (runner 自愈)
        shell: bash
        run: |
          if [ "${{ inputs.install_from_wheel }}" = "true" ]; then
            .venv-wheel/Scripts/python.exe -c "import shutil, win32com; shutil.rmtree(win32com.__gen_path__, ignore_errors=True)"
          else
            uv run python -c "import shutil, win32com; shutil.rmtree(win32com.__gen_path__, ignore_errors=True)"
          fi

      - name: Test COM + deck_render (真机)
        shell: bash
        run: |
          if [ "${{ inputs.install_from_wheel }}" = "true" ]; then
            .venv-wheel/Scripts/python.exe -m pytest tests -m "${{ inputs.test_marker }}" -q
          else
            uv run pytest tests -m "${{ inputs.test_marker }}" -q
          fi

      # RPC op 基准轻档（#107）：真机验证 bench 脚本不坏 + 指标能产出。
      # bench_ops 走 COM（client.call → server → Office），只能挂有 Office 的
      # 自托管 runner（Linux pure-module 无 Office 跑不了）；release 的
      # install_from_wheel 调用不跑这条，发布链行为保持不变。
      - name: Run RPC op benchmark (light gate)
        if: ${{ !inputs.install_from_wheel }}
        shell: bash
        run: uv run python scripts/bench/bench_ops.py

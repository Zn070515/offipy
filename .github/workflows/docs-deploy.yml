name: Docs Deploy

# push main 自动发布 mkdocs 文档站到 GitHub Pages；也可手动触发。
# 前置：仓库 Settings → Pages → Build and deployment → Source 选 GitHub Actions。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 部署环境唯一：并发触发不互相打断（cancel-in-progress: false 排队等前一个发布完）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # 不装 setup-python：uv 按 .python-version（3.12）自管解释器（setup-uv python-install: auto），
      # sync/run 都用同一解释器，无系统 Python 依赖。
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: Build docs (mkdocs --strict)
        run: uv run mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        id: deployment

name: Release

# 推送 v* tag 时跑完整发布门禁，全绿后创建 GitHub Release（附 wheel + sdist）。
# 门禁顺序：ruff check → ruff format --check → mypy → pytest → tag 版本 == __version__
# → uv build → twine check → 干净 venv 安装冒烟（scripts/install_smoke.py）
# → gh release create --verify-tag（tag 必须真实存在，防漏打 tag 误发）。
# PyPI 发布留到工程成熟后再加一步，见 CLAUDE.md 版本号更新规则。
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dev deps
        run: uv sync --extra dev

      - name: Install Playwright browser (deck 管线 DOM 测量)
        run: uv run playwright install chromium

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src/offipy

      - name: Test (pytest)
        run: uv run pytest tests -q

      - name: Verify tag version == __version__
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(uv run python -c 'import offipy; print(offipy.__version__)')"
          if [ "$tag" != "$ver" ]; then
            echo "tag '$GITHUB_REF_NAME' != offipy.__version__ '$ver'" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches __version__ $ver"

      - name: Build sdist + wheel
        run: uv build

      - name: Check dist (twine)
        shell: bash
        run: uvx twine check dist/*

      - name: Install smoke (clean venv)
        shell: bash
        run: uv run python scripts/install_smoke.py

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

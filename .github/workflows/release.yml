name: Release

# 推送 v* tag 时跑完整发布门禁，全绿后按「TestPyPI → PyPI 正式版」次序发布。
# 门禁链：quality（lint/type/pure-module 测试/wheel 解包实证/twine/tag 对齐）
# → office-real（自托管真机 COM + deck_render，发布必过）
# → publish-testpypi（OIDC Trusted Publishing 推 TestPyPI，预发布/正式版都先过）
# → publish-pypi（仅非预发布 tag 推 PyPI 正式版）。
#
# 前置（详见 docs/release.md）：
#   - TestPyPI / PyPI 项目需配置 Trusted Publishing（OIDC 联合本仓库）；
#   - `environment: testpypi` / `environment: pypi` 由 GitHub 首次使用自动创建，
#     可加 required reviewers 保护（此时发布需人工批准）。
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: windows-latest
    permissions:
      contents: read
    # 版本与构建 wheel 的 sha256 透传给 testpypi-smoke 做精确下载门禁（P0-5）
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.sha.outputs.sha256 }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dev deps
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src/offipy

      - name: Test (pure-module subset)
        # COM / deck_render 真机覆盖由 office-real 承担，这里跑纯模块子集。
        run: uv run pytest tests -m "not com and not deck_render" -q

      - name: Verify tag version == __version__ (PEP 440)
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(uv run python -c 'import offipy; print(offipy.__version__)')"
          uv run python - <<PY
          import sys
          from packaging.version import Version
          tag, ver = "$tag", "$ver"
          Version(tag)  # 非法 PEP 440（如漏预发布后缀）在此抛 ValueError
          Version(ver)
          if tag != ver:
              sys.exit(f"tag '$tag' != offipy.__version__ '$ver'")
          print(f"tag {tag} matches __version__ {ver}")
          PY

      - name: Version output
        id: version
        shell: bash
        run: echo "version=$(uv run python -c 'import offipy; print(offipy.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: uv build

      - name: Check dist (twine)
        shell: bash
        run: uvx twine check dist/*

      - name: Verify wheel 实证（verify_wheel.py：vendored/py.typed/licenses/icons/METADATA）
        shell: bash
        run: uv run python scripts/verify_wheel.py

      - name: Wheel sha256 output
        id: sha
        shell: bash
        run: |
          whl=$(ls dist/*.whl | head -n1)
          echo "sha256=$(sha256sum "$whl" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: offipy-dist
          path: dist/
          if-no-files-found: error

  # 自托管真机门禁：COM + deck_render 集成测试。发布必须过它。
  office-real:
    runs-on: [self-hosted, windows, office]
    needs: quality
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Install Playwright browser (deck 管线 DOM 测量)
        run: uv run playwright install chromium

      - name: Test COM + deck_render (真机)
        run: uv run pytest tests -m "com or deck_render" -q

  # 创建 GitHub Release（附验证过的 sdist + wheel）。真机门禁过才建。
  gh-release:
    runs-on: ubuntu-latest
    needs: [quality, office-real]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offipy-dist
          path: dist
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  # 发布到 TestPyPI（Trusted Publishing / OIDC）：预发布与正式版都先过 TestPyPI。
  publish-testpypi:
    runs-on: ubuntu-latest
    needs: [quality, office-real]
    permissions:
      id-token: write  # OIDC 联合 TestPyPI
      contents: read
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offipy-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # 同版本重跑不报错（TestPyPI 不允许重复版本号，skip 让幂等重试安全）
          skip-existing: true

  # TestPyPI 精确安装门禁（P0-5）：等 TestPyPI 索引可见后，精确下载 wheel，
  # 与构建产物 sha256 比对（同一内容，防「旧同版本被 skip」），干净 venv 安装 + 冒烟。
  # 正式版发布前必过它——证明「TestPyPI 上的就是本轮构建产物」。
  testpypi-smoke:
    runs-on: ubuntu-latest
    needs: [quality, office-real, publish-testpypi]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dev deps
        run: uv sync --extra dev

      - name: Wait for TestPyPI index visibility (bounded)
        shell: bash
        run: |
          ver="${{ needs.quality.outputs.version }}"
          for i in $(seq 1 12); do
            if curl -fsS "https://test.pypi.org/pypi/offipy/$ver/json" >/dev/null 2>&1; then
              echo "offipy==$ver visible on TestPyPI"; exit 0
            fi
            echo "waiting ($i/12) for offipy==$ver on TestPyPI ..."
            sleep 10
          done
          echo "offipy==$ver not visible on TestPyPI after retries"; exit 1

      - name: Exact-download smoke (sha256 门禁)
        shell: bash
        run: |
          uv run python scripts/pypi_smoke.py \
            --version "${{ needs.quality.outputs.version }}" \
            --expected-sha256 "${{ needs.quality.outputs.sha256 }}"

  # 发布到 PyPI 正式版：仅非预发布 tag（0.9.0a1 这类预发布不推 PyPI 正式版）。
  publish-pypi:
    runs-on: ubuntu-latest
    needs: [publish-testpypi, testpypi-smoke]
    if: github.ref_type == 'tag' && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc')
    permissions:
      id-token: write  # OIDC 联合 PyPI
      contents: read
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offipy-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

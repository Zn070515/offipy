name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 工作日凌晨跑自托管 Office 真机回归（COM + deck_render）
    - cron: "23 2 * * 1-5"

jobs:
  # Linux 纯模块：无 Office / 无 chromium 也能全量收集并跑核心逻辑，
  # 挂覆盖率门槛（阈值按纯模块子集实测校准，本机 81%）。
  pure-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7.1.4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format (ruff format)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src/offipy
      - name: Test pure-module subset + coverage gate
        run: uv run pytest tests -m "not com and not deck_render" --cov=offipy --cov-fail-under=70 -q

  # Windows 全量：含 deck_render（安装 chromium），COM 测试无 Office 自动跳过
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7.1.4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Install Playwright browser (deck 管线 DOM 测量)
        run: uv run playwright install chromium
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format (ruff format)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src/offipy
      - name: Test (pytest)
        run: uv run pytest tests -q

  # 打包 smoke：构建 wheel + 干净 venv 安装 + import/check（release 门禁）
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7.1.4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: uv build
      - name: Install smoke (干净 venv 装 wheel)
        run: python scripts/install_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: offipy-wheel
          path: dist/*.whl

  # 自托管 Office runner：真机 COM + deck_render 集成测试。
  # push/schedule 常跑，PR 也跑（合并门禁）；fork PR 无自托管 runner 权限跳过。
  # 仓库设置里请把本 job 加为 PR 必过 status check（required check）——fork PR
  # 会因 runner 不可用而跳过，需要在分支保护里豁免（如 paths-ignore 或 allow skip）。
  office-real:
    if: (github.event_name == 'push' || github.event_name == 'schedule') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, office]
    # 自托管 runner 直连 github.com 主站被墙（api.github.com 能通、主站超时），
    # git fetch / setup-uv 下载 / uv sync 全部经本机 VPN 本地代理 127.0.0.1:12334。
    # 代理地址是这台 runner 宿主机 VPN 的端口，换 VPN/端口时需同步。
    env:
      http_proxy: http://127.0.0.1:12334
      https_proxy: http://127.0.0.1:12334
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7.1.4  # ≥7.1.4 修复自托管 Windows runner 的 Node libuv 崩溃（UV_HANDLE_CLOSING，src\win\async.c）
        with:
          enable-cache: false
      # 自托管 runner 服务非管理员账户，actions/setup-python 查/清注册表被拒
      # （SecurityException），故不装系统 Python——uv 按 .python-version(3.12)
      # 自管/自装解释器，绕开注册表权限。
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Install Playwright browser (deck 管线 DOM 测量)
        run: uv run playwright install chromium
      - name: Test COM + deck_render (真机)
        run: uv run pytest tests -m "com or deck_render" -q

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 工作日凌晨跑自托管 Office 真机回归（COM + deck_render）
    - cron: "23 2 * * 1-5"

jobs:
  # Linux 纯模块：无 Office / 无 chromium 也能全量收集并跑核心逻辑，
  # 挂覆盖率门槛（阈值按纯模块子集实测校准，本机 ~91%，88 留 3pt 余量）。
  pure-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format (ruff format)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src/offipy
      - name: Test pure-module subset + coverage gate
        run: uv run pytest tests -m "not com and not deck_render" --cov=offipy --cov-fail-under=88 -q
      - name: Art layer pure import gate（无 c-ext / 无 python-pptx）
        run: uv run python -c "import offipy; offipy.build_scene; offipy.analyze_scene; print('art pure ok')"

  # 最新依赖门禁（P1-6）：锁文件测试一条（windows/pure-module）之外，另起一条
  # `uv sync --upgrade` 解析到依赖上限内的最新版本跑纯模块子集——范围锁死不掩盖
  # 上游破坏性变更；配合 dependabot 每周批量升级 PR，跨上限大版本需人工审。
  latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Sync dependencies (latest allowed)
        run: uv sync --extra dev --upgrade
      - name: Test pure-module subset (latest deps)
        run: uv run pytest tests -m "not com and not deck_render" -q

  # Windows 全量：含 deck_render（安装 chromium），COM 测试无 Office 自动跳过
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Install Playwright browser (deck 管线 DOM 测量)
        run: uv run playwright install chromium
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format (ruff format)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src/offipy
      - name: Test (pytest + coverage)
        # COM 测试在无 Office 的 runner 上自动跳过，覆盖率用宽容门槛；
        # 阈值按真机矩阵实测校准（#104）。xml 报告上传为 artifact。
        run: uv run pytest tests -q --cov=offipy --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=50
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-windows-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  # 打包 smoke：构建 wheel + 干净 venv 安装 + import/check（release 门禁）
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: uv build
      - name: Check dist (twine)
        run: uvx twine check dist/*
      - name: Install smoke (干净 venv 装 wheel，含 art acceptance 真实 analyze_scene)
        run: python scripts/install_smoke.py --acceptance-dir tests/fixtures/art/scenes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offipy-wheel
          path: dist/*.whl

  # 自托管 Office runner：真机 COM + deck_render 集成测试。与 release 共享
  # reusable office-tests.yml（P0-5），防两处 runner 配置漂移。
  # push/schedule 常跑，PR 也跑（合并门禁）；fork PR 无自托管 runner 权限跳过。
  # 仓库设置里请把本 job 加为 PR 必过 status check（required check）——fork PR
  # 会因 runner 不可用而跳过，需要在分支保护里豁免（如 paths-ignore 或 allow skip）。
  office-real:
    if: (github.event_name == 'push' || github.event_name == 'schedule') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/office-tests.yml
    with:
      install_from_wheel: false
    secrets: inherit

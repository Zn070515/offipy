<!-- examples/decks/charts/chart-demo.html -->
<!DOCTYPE html>
<html>
<head>
  <style data-theme="mckinsey"></style>
  <style data-layouts></style>
</head>
<body>
<section class="slide" data-pptx-slide>
  <h2 class="title">营收增长</h2>
  <div class="chart" data-chart="bar"
       data-chart-data='{"categories":["Q1","Q2","Q3","Q4"],"series":[{"name":"营收","values":[40,55,70,92]}]}'></div>
</section>
<section class="slide" data-pptx-slide>
  <h2 class="title">渠道占比</h2>
  <div class="chart" id="share" data-chart="pie"></div>
  <script type="application/json" data-chart-target="#share">
    {"categories":["直销","渠道","线上"],"series":[{"name":"份额","values":[45,35,20]}]}
  </script>
</section>
</body>
</html>

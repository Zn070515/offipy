[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offipy"
description = "Live Microsoft Office automation via COM (session-based) + HTML-first slide pipeline"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX 表达式：本体 + vendored 转换器/Phosphor 为 MIT，内嵌 Lucide 图标为 ISC
# （两者都随 wheel/sdist 分发，见 THIRD_PARTY_NOTICES.md）
license = "MIT AND ISC"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/offipy/assets/icons/LICENSE-*.txt"]
authors = [{ name = "XuXin", email = "302025510036@zjut.edu.cn" }]
keywords = ["office", "automation", "com", "word", "excel", "powerpoint", "pptx", "html-to-pptx", "mcp"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 核心依赖只保留纯 Python 运行时必需：tomli（3.10 无标准库 tomllib）。
# 平台/能力依赖全部拆进 optional-dependencies（office/deck/mcp/all）：
# 核心 `import offipy` 零额外依赖，按用途增量安装。
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Zn070515/office-kit"
Changelog = "https://github.com/Zn070515/office-kit/blob/main/CHANGELOG.md"
Source = "https://github.com/Zn070515/office-kit"

[project.optional-dependencies]
# Windows COM 自动化（Word/Excel/PowerPoint 会话驱动）
office = [
    "pywin32; platform_system == 'Windows'",
]
# HTML→可编辑 PPTX 管线（deck render / make）
deck = [
    "python-pptx>=1.0.2",
    "lxml>=5.0",
    "fonttools>=4.0",
    "playwright>=1.40",
    "Pillow>=10.0",
]
# MCP server（offipy mcp，Claude Desktop 等接入）
mcp = [
    "mcp>=2.0,<3.0",
]
all = ["offipy[office,deck,mcp]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "offipy[all]",
]

[project.scripts]
offipy = "offipy.cli:main"

# 版本单一来源：从 src/offipy/__init__.py 的 __version__ 读取
[tool.hatch.version]
path = "src/offipy/__init__.py"

# wheel-exclude 相对包根（src/offipy）：vendored 转换器主体进包，
# 仅剔除其自检资产（assets 对比 PNG ~8MB）与自带测试套件——两者运行时不需要。
[tool.hatch.build.targets.wheel]
packages = ["src/offipy"]
exclude = [
  "_vendor/html_to_editable_pptx/assets",
  "_vendor/html_to_editable_pptx/tests",
]
# py.typed 是 PEP 561 marker：hatchling 不自动带非源码文件，force-include 进包供 mypy 消费
[tool.hatch.build.targets.wheel.force-include]
"src/offipy/py.typed" = "offipy/py.typed"

[tool.hatch.build.targets.sdist]
# 只打包构建 wheel 所需：src + pyproject + README/LICENSE。
# 文档、示例、测试、CI 一律不进源码包；vendored 转换器的自检资产/测试
# 同样剔除，否则 sdist 被 PNG 对比图撑到 8MB+。
exclude = [
  "/.github",
  "/docs",
  "/examples",
  "/logs",
  "/tests",
  "/src/offipy/_vendor/html_to_editable_pptx/assets",
  "/src/offipy/_vendor/html_to_editable_pptx/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "com: 需要存活 Office/COM server 的集成测试（无 Office 环境自动跳过）",
    "deck_render: HTML→PPTX 转换管线集成测试（需 chromium 渲染，仅 Windows/真机跑）",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# docs/ 里的 plan 文档含 python 代码块，ruff format 会递归处理 markdown，
# 排除以免 CI 误伤；test/ 是 src-layout 迁移前的遗留产物目录；
# src/offipy/_vendor/ 是 vendored 转换器（外协代码，不做 lint/format 约束）。
exclude = ["docs/", "test/", "src/offipy/_vendor/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src/offipy"]
# vendored 转换器是外协代码，不进类型检查（与 ruff exclude 一致）
exclude = ["src/offipy/_vendor/"]
ignore_missing_imports = true
show_error_codes = true

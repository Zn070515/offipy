[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offipy"
description = "Live Microsoft Office automation via COM (session-based) + HTML-first slide pipeline"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX 表达式：本体 + vendored 转换器/图表 skill/Phosphor 为 MIT，
# 内嵌 Lucide 图标为 ISC（都随 wheel/sdist 分发，见 THIRD_PARTY_NOTICES.md）
license = "MIT AND ISC"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/offipy/assets/icons/LICENSE-*.txt",
    "src/offipy/_vendor/html_to_editable_pptx/LICENSE",
    "src/offipy/_vendor/diagram-design/LICENSE",
    "src/offipy/_vendor/diagram-design/THIRD_PARTY_LICENSES.md",
]
# 公开 wheel/sdist 元数据不暴露学校邮箱，用 GitHub noreply（开源联系走 Issues/讨论）
authors = [{ name = "XuXin", email = "247738477+Zn070515@users.noreply.github.com" }]
keywords = ["office", "automation", "com", "word", "excel", "powerpoint", "pptx", "html-to-pptx", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 核心依赖只保留纯 Python 运行时必需：tomli（3.10 无标准库 tomllib）。
# 平台/能力依赖全部拆进 optional-dependencies（office/deck/mcp/all）：
# 核心 `import offipy` 零额外依赖，按用途增量安装。
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Zn070515/offipy"
Changelog = "https://github.com/Zn070515/offipy/blob/main/CHANGELOG.md"
Issues = "https://github.com/Zn070515/offipy/issues"
Documentation = "https://github.com/Zn070515/offipy#readme"
Source = "https://github.com/Zn070515/offipy"

[project.optional-dependencies]
# Windows COM 自动化（Word/Excel/PowerPoint 会话驱动）
office = [
    "pywin32>=310; platform_system == 'Windows'",
]
# HTML→可编辑 PPTX 管线（deck render / make）
# P1-6：下限保证 API 基线，上限防重大版本破坏性变更未经验证就随升级上线
deck = [
    "python-pptx>=1.0.2,<2",
    "lxml>=5.0",
    "fonttools>=4.0",
    "playwright>=1.40,<2",
    "Pillow>=10.0",
]
# MCP server（offipy mcp，Claude Desktop 等接入）
mcp = [
    "mcp>=2.0,<3.0",
]
all = ["offipy[office,deck,mcp]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "offipy[all]",
]

[project.scripts]
offipy = "offipy.cli:main"

# 版本单一来源：从 src/offipy/__init__.py 的 __version__ 读取
[tool.hatch.version]
path = "src/offipy/__init__.py"

# wheel-exclude 相对包根（src/offipy）：vendored 转换器主体进包，
# 仅剔除其自检资产（assets 对比 PNG ~8MB）与自带测试套件——两者运行时不需要。
[tool.hatch.build.targets.wheel]
packages = ["src/offipy"]
exclude = [
  "src/offipy/_vendor/html_to_editable_pptx/assets",
  "src/offipy/_vendor/html_to_editable_pptx/tests",
]

[tool.hatch.build.targets.sdist]
# 只打包构建 wheel 所需：src + pyproject + README/LICENSE。
# 文档、示例、测试、CI 一律不进源码包；vendored 转换器的自检资产/测试
# 同样剔除，否则 sdist 被 PNG 对比图撑到 8MB+。
exclude = [
  "/.github",
  "/docs",
  "/examples",
  "/logs",
  "/tests",
  "/src/offipy/_vendor/html_to_editable_pptx/assets",
  "/src/offipy/_vendor/html_to_editable_pptx/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# 让 tests/ 能 import scripts/pypi_smoke 等发布脚本（P0-1 门禁单测）
pythonpath = ["."]
# 任何 warning 视为失败：上游弃用 API 换代、测试自身警告都立刻暴露，不静默绿
filterwarnings = ["error"]
markers = [
    "com: 需要存活 Office/COM server 的集成测试（无 Office 环境自动跳过）",
    "deck_render: HTML→PPTX 转换管线集成测试（需 chromium 渲染，仅 Windows/真机跑）",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# docs/ 里的 plan 文档含 python 代码块，ruff format 会递归处理 markdown，
# 排除以免 CI 误伤；test/ 是 src-layout 迁移前的遗留产物目录；
# src/offipy/_vendor/ 是 vendored 转换器（外协代码，不做 lint/format 约束）。
exclude = ["docs/", "test/", "src/offipy/_vendor/"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "A", "ARG", "C4", "DTZ", "ERA", "FLY", "ICN", "INP", "INT", "PERF",
    "PIE", "PT", "PTH", "PYI", "Q", "RET", "RUF", "SLF", "T", "TC", "TID",
    "TRY",
]
# TRY003（raise-vanilla-args）不启用：库的错误消息刻意用描述性中文多行文本
# 直接进 CLI/协议面，TRY003 要求的「自定义异常类承载长消息」是相反的设计哲学，
# 全库约 400 处全改会退化成无信息异常或几百个空壳异常类，收益为零。
ignore = ["TRY003"]
# 中文文档/注释/字符串里的全角标点与数学符号是正常排版（非同形字攻击），
# RUF001/002/003 只查 Unicode confusables 表，这里放行本项目实际使用的字符。
allowed-confusables = [
    "（", "）", "，", "：", "；", "？", "＋",
    "×", "−", "–", "∪",
]

[tool.ruff.lint.per-file-ignores]
# gen_api_ref.py 的 _EN_DESC 是英文翻译数据表，长描述字符串天然超 100 列
"scripts/gen_api_ref.py" = ["E501"]
# api.pyi 是生成的类型 stub，长签名行天然超 100 列；PYI* 规则约束的
# exit 注解/泛型写法、Q000 的单引号风格都与生成器输出冲突——均由生成器 +
# 漂移测试保证一致，手改无效
"src/offipy/api.pyi" = ["E501", "PYI", "Q000"]
# T201（print）在 CLI/诊断路径是「输出即接口」：cli.py 打印命令结果、
# envcheck.py 打印环境诊断、server.py 打印启动/警告——改成 logging 会破坏契约，
# 定向放行，非调试残留。
"src/offipy/cli.py" = ["T201"]
"src/offipy/envcheck.py" = ["T201"]
"src/offipy/server.py" = ["T201"]
# SLF001（私有成员访问）：这几个模块按设计工作在 python-pptx 的 OOXML XML 层
# （_element/_spTree/_get_or_add_ln/_txBody/_p/_r 等），python-pptx 对 raw XML
# 元素访问不提供公开 API，下划线属性访问是唯一途径且刻意为之——定向放行。
"src/offipy/assets/render.py" = ["SLF001"]
"src/offipy/audit/extract.py" = ["SLF001"]
"src/offipy/charts.py" = ["SLF001"]
"src/offipy/diagrams.py" = ["SLF001"]
"src/offipy/drawio.py" = ["SLF001"]
"src/offipy/icons.py" = ["SLF001"]
# tests/** 测试惯用模式定向放行（非 blanket ignore，只放行这组）：SLF001 是
# python-pptx 内部 XML 断言（验证产出结构），ARG001-005 是 fixture/回调未用参数，
# PT011/PT012/PT018 是 pytest 宽泛/复合断言——都是测试的常见写法，逐条改反而
# 降低可读性；其余规则 tests 照常参与门禁。
# TRY301：测试里刻意在 try 块内构造异常链（验证 _safe_trace/脱敏），抽象成辅助函数反而失焦
"tests/**" = ["SLF001", "ARG001", "ARG002", "ARG003", "ARG004", "ARG005", "PT011", "PT012", "PT018", "TRY301"]
# examples/** 与 scripts/** 是独立脚本（刻意不设 __init__.py 成包）：
# INP001 属误报；T201 print 即这些脚本的输出界面（demo/bench/smoke/生成器）。
"examples/**" = ["INP001", "T201"]
"scripts/**" = ["INP001", "T201"]
# tests/fixtures/ 下的 generate_*.py 是手工重生成 fixture 的独立脚本（同 scripts/，
# 刻意不成包）
"tests/fixtures/**" = ["INP001"]

[tool.ruff.format]
quote-style = "double"
# 生成的 api.pyi 保持生成器输出（长签名单行），不套 ruff 换行
exclude = ["src/offipy/api.pyi"]

[tool.mypy]
python_version = "3.10"
# offipy 是 Windows-only 库（COM/winreg 专用），Linux CI 上也按 win32 平台
# 做类型检查，否则 typeshed 会把 winreg 常量/函数当非 Windows 隐藏而误报
platform = "win32"
files = ["src/offipy"]
# vendored 转换器是外协代码，不进类型检查（与 ruff exclude 一致）
exclude = ["src/offipy/_vendor/"]
ignore_missing_imports = true
show_error_codes = true
strict = true

[[tool.mypy.overrides]]
# api.pyi 是生成桩：统一省略泛型参数是生成器的约定输出，strict 的
# disallow_any_generics 与生成器风格冲突——手改桩无效，漂移测试保证一致
module = "offipy.api"
disallow_any_generics = false

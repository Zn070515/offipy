[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offipy"
description = "Live Microsoft Office automation via COM (session-based) + HTML-first slide pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "XuXin", email = "302025510036@zjut.edu.cn" }]
# pywin32 仅支持 Windows：平台标记保证在 Linux/macOS 上也能解析依赖树
# python-pptx/lxml/fonttools/playwright/Pillow 是 HTML→可编辑 PPTX 管线的硬依赖
# （vendored 转换器的 requirements，先前散装 pip install、未入 pyproject，
# 导致 uv sync 把它们清掉）。pdf2image 仅在自检可选路径懒加载，不入依赖。
# mcp 是 MCP server（offipy mcp / python -m offipy.mcp_server）的协议运行时。
dependencies = [
    "pywin32; platform_system == 'Windows'",
    "python-pptx>=1.0.2",
    "lxml>=5.0",
    "fonttools>=4.0",
    "playwright>=1.40",
    "Pillow>=10.0",
    "mcp>=1.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
offipy = "offipy.cli:main"

# 版本单一来源：从 src/offipy/__init__.py 的 __version__ 读取
[tool.hatch.version]
path = "src/offipy/__init__.py"

# wheel-exclude 相对包根（src/offipy）：vendored 转换器主体进包，
# 仅剔除其自检资产（assets 对比 PNG ~8MB）与自带测试套件——两者运行时不需要。
[tool.hatch.build.targets.wheel]
packages = ["src/offipy"]
exclude = [
  "_vendor/html_to_editable_pptx/assets",
  "_vendor/html_to_editable_pptx/tests",
]

[tool.hatch.build.targets.sdist]
# 只打包构建 wheel 所需：src + pyproject + README/LICENSE。
# 文档、示例、测试、CI 一律不进源码包；vendored 转换器的自检资产/测试
# 同样剔除，否则 sdist 被 PNG 对比图撑到 8MB+。
exclude = [
  "/.github",
  "/docs",
  "/examples",
  "/logs",
  "/tests",
  "/src/offipy/_vendor/html_to_editable_pptx/assets",
  "/src/offipy/_vendor/html_to_editable_pptx/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "com: 需要存活 Office/COM server 的集成测试（无 Office 环境自动跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# docs/ 里的 plan 文档含 python 代码块，ruff format 会递归处理 markdown，
# 排除以免 CI 误伤；test/ 是 src-layout 迁移前的遗留产物目录；
# src/offipy/_vendor/ 是 vendored 转换器（外协代码，不做 lint/format 约束）；
# ChatGPT_v1.md 是第三方审核参考文档（未纳入仓库），不参与 format。
exclude = ["docs/", "test/", "src/offipy/_vendor/", "ChatGPT_v1.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src/offipy"]
# vendored 转换器是外协代码，不进类型检查（与 ruff exclude 一致）
exclude = ["src/offipy/_vendor/"]
ignore_missing_imports = true
show_error_codes = true
